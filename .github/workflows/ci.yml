name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate PowerShell scripts
        run: |
          find . -name '*.ps1' -exec pwsh -Command "Get-Command -Syntax {}" \; 2>/dev/null || true
          echo "PowerShell syntax check complete"
